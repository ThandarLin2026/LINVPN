<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Subdomain Finder Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0f1a; color: #f8fafc; }
        .glass-card { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .loader { border: 3px solid rgba(59, 130, 246, 0.1); border-top: 3px solid #3b82f6; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .success-glow { box-shadow: 0 0 20px rgba(16, 185, 129, 0.1); }
    </style>
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

    <div class="max-w-4xl mx-auto px-6 py-16">
        <!-- Header -->
        <div class="text-center mb-12">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-blue-600/10 rounded-3xl mb-6 border border-blue-500/20 shadow-2xl shadow-blue-500/10">
                <i class="fas fa-search-location text-blue-500 text-3xl"></i>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4 text-white">Subdomain Finder Pro</h1>
            <p class="text-slate-400 text-lg">Infrastructure Discovery & Cloudflare Detection Tool</p>
        </div>

        <!-- Search Area -->
        <div class="glass-card p-8 md:p-10 rounded-[2.5rem] shadow-2xl mb-8">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-6 flex items-center pointer-events-none text-slate-500">
                        <i class="fas fa-globe"></i>
                    </div>
                    <input type="text" id="domainInput" placeholder="ဥပမာ - dtac.co.th" 
                        class="block w-full pl-14 pr-6 py-5 rounded-2xl bg-slate-900/50 border border-slate-800 text-white placeholder-slate-600 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-lg">
                </div>
                <button id="scanBtn" onclick="initiateScan()" 
                    class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-5 rounded-2xl font-bold text-lg shadow-lg shadow-blue-500/20 transition-all flex items-center justify-center gap-3 active:scale-95 disabled:opacity-50">
                    <span id="btnText">Scan စတင်မည်</span>
                    <div id="btnLoader" class="loader hidden"></div>
                </button>
            </div>
            
            <div id="progressContainer" class="hidden mt-8 space-y-3">
                <div class="flex justify-between text-xs font-bold uppercase tracking-widest text-slate-500">
                    <span id="progressText">Scanning...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                    <div id="progressBar" class="bg-blue-600 h-full w-0 transition-all duration-500"></div>
                </div>
            </div>
        </div>

        <!-- Status/Error Box -->
        <div id="statusBox" class="hidden mb-8 p-6 rounded-3xl text-center font-bold border-2 backdrop-blur-md"></div>

        <!-- Results -->
        <div id="resultsWrapper" class="hidden space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
            <div class="glass-card rounded-[2rem] shadow-xl overflow-hidden border border-slate-800">
                <div class="px-8 py-5 border-b border-slate-800 flex justify-between items-center bg-slate-900/30">
                    <h2 class="text-sm font-black uppercase tracking-widest text-slate-400">Discovery Results</h2>
                    <span id="resultCount" class="bg-blue-500/10 text-blue-500 text-[10px] font-black px-3 py-1 rounded-full border border-blue-500/20">0 Found</span>
                </div>
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-slate-900/50 border-b border-slate-800">
                            <th class="px-8 py-5 text-[10px] font-black text-slate-500 uppercase tracking-widest">Subdomain</th>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-500 uppercase tracking-widest">IP / Mapping</th>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-500 uppercase tracking-widest text-right">Protection</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody" class="divide-y divide-slate-800/50"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // No manual API Key needed here.
        const apiKey = ""; 

        async function initiateScan() {
            const domain = document.getElementById('domainInput').value.trim().toLowerCase().replace(/^https?:\/\//, '').split('/')[0];
            if (!domain || !domain.includes('.')) {
                showStatus("မှန်ကန်သော Domain အမည် ထည့်သွင်းပေးပါ", "bg-red-500/10 text-red-500 border-red-500/20");
                return;
            }

            const btn = document.getElementById('scanBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const statusBox = document.getElementById('statusBox');
            const resultsWrapper = document.getElementById('resultsWrapper');
            const resultsBody = document.getElementById('resultsBody');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');

            // Reset UI
            btn.disabled = true;
            btnText.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            statusBox.classList.add('hidden');
            resultsWrapper.classList.add('hidden');
            progressContainer.classList.remove('hidden');
            resultsBody.innerHTML = '';
            progressBar.style.width = '10%';
            progressPercent.textContent = '10%';

            try {
                // Phase 1: AI Search & Discovery
                const systemPrompt = "You are a reconnaissance expert. Search for public subdomains for the target. Return ONLY JSON format: {\"subdomains\": [{\"name\": \"sub.domain.com\", \"ip\": \"1.1.1.1\", \"infra\": \"Cloudflare\"}]}";
                const userQuery = `Find active subdomains and infrastructure for ${domain}. Focus on production subdomains.`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    referrerPolicy: "no-referrer",
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userQuery }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        tools: [{ "google_search": {} }]
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    if (err.error?.message?.includes("unregistered callers")) {
                        throw new Error("API Key setup error. Browser မှ တိုက်ရိုက်သုံးခွင့်မရပါ။");
                    }
                    throw new Error(err.error?.message || "Scan error occurred.");
                }

                progressBar.style.width = '70%';
                progressPercent.textContent = '70%';

                const data = await response.json();
                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                const jsonMatch = aiText.match(/\{[\s\S]*\}/);
                
                if (!jsonMatch) throw new Error("ဒေတာ မတွေ့ရှိပါ။");
                const result = JSON.parse(jsonMatch[0]);

                progressBar.style.width = '100%';
                progressPercent.textContent = '100%';
                
                renderResults(result.subdomains || []);
                resultsWrapper.classList.remove('hidden');

            } catch (err) {
                showStatus("Error: " + err.message, "bg-red-500/10 text-red-400 border-red-500/20");
            } finally {
                btn.disabled = false;
                btnText.classList.remove('hidden');
                btnLoader.classList.add('hidden');
                setTimeout(() => progressContainer.classList.add('hidden'), 1000);
            }
        }

        function renderResults(subdomains) {
            const resultsBody = document.getElementById('resultsBody');
            const resultCount = document.getElementById('resultCount');
            
            resultCount.textContent = `${subdomains.length} Found`;
            
            subdomains.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "group hover:bg-slate-800/30 transition-all";
                
                const infra = (item.infra || '').toLowerCase();
                let badgeClass = "text-slate-500 border-slate-800";
                
                if (infra.includes('cloudflare')) {
                    badgeClass = "bg-orange-500/10 text-orange-500 border-orange-500/20";
                } else if (infra.includes('aws') || infra.includes('amazon')) {
                    badgeClass = "bg-blue-500/10 text-blue-500 border-blue-500/20";
                } else if (infra.includes('google')) {
                    badgeClass = "bg-emerald-500/10 text-emerald-500 border-emerald-500/20";
                }

                tr.innerHTML = `
                    <td class="px-8 py-6">
                        <div class="flex items-center gap-3">
                            <div class="w-1.5 h-1.5 rounded-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.5)]"></div>
                            <span class="text-sm font-bold text-slate-200 group-hover:text-blue-400 transition-colors">${item.name}</span>
                        </div>
                    </td>
                    <td class="px-8 py-6 text-xs font-mono text-slate-500">${item.ip || '—'}</td>
                    <td class="px-8 py-6 text-right">
                        <span class="px-3 py-1 rounded-lg text-[9px] font-black uppercase border tracking-wider ${badgeClass}">
                            ${item.infra || 'Direct'}
                        </span>
                    </td>
                `;
                resultsBody.appendChild(tr);
            });
        }

        function showStatus(msg, classes) {
            const statusBox = document.getElementById('statusBox');
            statusBox.textContent = msg;
            statusBox.className = `mb-8 p-6 rounded-3xl text-center font-bold border-2 backdrop-blur-md ${classes}`;
            statusBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
