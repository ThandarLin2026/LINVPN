<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subdomain Recon Pro | Provider Detection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
        .cyber-card { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(59, 130, 246, 0.2); backdrop-filter: blur(15px); }
        .loading-spinner { border: 3px solid rgba(59, 130, 246, 0.1); border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-online { color: #10b981; }
        .status-offline { color: #ef4444; }
        .cf-badge { background: #f38020; color: white; }
        .aws-badge { background: #232f3e; color: #ff9900; border: 1px solid #ff9900; }
        .provider-badge { background: #1e293b; color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }
    </style>
</head>
<body class="min-h-screen">

    <div class="max-w-6xl mx-auto px-6 py-12">
        <!-- Header -->
        <div class="text-center mb-10">
            <div class="inline-block p-4 rounded-3xl bg-blue-600/10 border border-blue-500/20 mb-6 text-blue-500">
                <i class="fas fa-server text-3xl"></i>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tight text-white mb-2">Sub Domain Finder</h1>
            <p class="text-slate-400 font-medium italic">Deep Provider Detection • IP Mapping • Live Monitor</p>
        </div>

        <!-- Input Section -->
        <div class="cyber-card p-6 md:p-8 rounded-[2rem] shadow-2xl mb-8">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-6 flex items-center pointer-events-none text-slate-500">
                        <i class="fas fa-search"></i>
                    </div>
                    <input type="text" id="targetDomain" placeholder="ဥပမာ - dtac.co.th" 
                        class="block w-full pl-14 pr-6 py-5 rounded-2xl bg-slate-950 border border-slate-800 text-white placeholder-slate-600 focus:ring-2 focus:ring-blue-500 outline-none transition-all text-lg">
                </div>
                <button id="searchBtn" onclick="performScan()" 
                    class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-5 rounded-2xl font-bold transition-all flex items-center justify-center gap-3 active:scale-95 shadow-xl shadow-blue-500/20">
                    <span id="btnLabel">Full Scan</span>
                    <div id="loader" class="loading-spinner hidden"></div>
                </button>
            </div>
        </div>

        <!-- Alert Box -->
        <div id="alertBox" class="hidden mb-8 p-6 rounded-2xl border-2 text-center font-bold"></div>

        <!-- Results Table -->
        <div id="resultsArea" class="hidden space-y-6">
            <div class="cyber-card rounded-3xl overflow-hidden shadow-2xl border border-slate-800">
                <div class="px-8 py-5 bg-slate-900/50 border-b border-slate-800 flex justify-between items-center">
                    <h2 class="text-xs font-black uppercase tracking-widest text-slate-500">Infrastructure Intelligence</h2>
                    <span id="countBadge" class="bg-blue-600 text-white text-[10px] px-3 py-1 rounded-full font-black">0 Found</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left min-w-[900px]">
                        <thead>
                            <tr class="text-slate-500 text-[10px] font-black uppercase tracking-wider border-b border-slate-800/50 bg-slate-900">
                                <th class="px-8 py-4">Subdomain</th>
                                <th class="px-8 py-4">IP Address</th>
                                <th class="px-8 py-4">Provider / ISP</th>
                                <th class="px-8 py-4 text-center">Status</th>
                                <th class="px-8 py-4 text-right">Link</th>
                            </tr>
                        </thead>
                        <tbody id="dataTable" class="divide-y divide-slate-800/30 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function performScan() {
            const domain = document.getElementById('targetDomain').value.trim();
            if (!domain) {
                showAlert("Domain အမည် ထည့်သွင်းပေးပါ", "error");
                return;
            }

            const cleanDomain = domain.replace(/^https?:\/\//, '').split('/')[0];
            const btn = document.getElementById('searchBtn');
            const btnLabel = document.getElementById('btnLabel');
            const loader = document.getElementById('loader');
            const resultsArea = document.getElementById('resultsArea');
            const dataTable = document.getElementById('dataTable');
            const alertBox = document.getElementById('alertBox');

            btn.disabled = true;
            btnLabel.classList.add('hidden');
            loader.classList.remove('hidden');
            alertBox.classList.add('hidden');
            resultsArea.classList.remove('hidden');
            dataTable.innerHTML = '';

            try {
                // Step 1: Subdomain Discovery (Rapid API replacement logic)
                const response = await fetch(`https://api.hackertarget.com/hostsearch/?q=${cleanDomain}`);
                const rawText = await response.text();
                
                let subData = [];
                if (rawText.includes("error") || !rawText.trim()) {
                    const altRes = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://crt.sh/?q=${cleanDomain}&output=json`)}`);
                    const altJson = await altRes.json();
                    const data = JSON.parse(altJson.contents);
                    subData = [...new Set(data.map(item => item.name_value.toLowerCase().split('\n')[0]))].filter(n => n.includes(cleanDomain));
                } else {
                    subData = rawText.split('\n').map(l => l.split(',')[0]).filter(n => n && n.includes(cleanDomain));
                }

                const uniqueSubs = [...new Set(subData)];
                document.getElementById('countBadge').textContent = `${uniqueSubs.length} Found`;

                // Step 2: Resolution
                for (const sub of uniqueSubs) {
                    processSubdomain(sub);
                }

            } catch (err) {
                showAlert("Error: " + err.message, "error");
            } finally {
                btn.disabled = false;
                btnLabel.classList.remove('hidden');
                loader.classList.add('hidden');
            }
        }

        async function processSubdomain(sub) {
            const rowId = `row-${sub.replace(/\./g, '-')}`;
            const row = document.createElement('tr');
            row.className = "hover:bg-slate-800/40 transition-colors group";
            row.id = rowId;
            row.innerHTML = `
                <td class="px-8 py-5 font-bold text-slate-200 group-hover:text-blue-400">${sub}</td>
                <td class="px-8 py-5 font-mono text-slate-500" id="ip-${rowId}">Resolving...</td>
                <td class="px-8 py-5" id="provider-${rowId}"><span class="animate-pulse text-slate-700">Checking WHOIS...</span></td>
                <td class="px-8 py-5 text-center" id="status-${rowId}"><i class="fas fa-circle-notch fa-spin opacity-20"></i></td>
                <td class="px-8 py-5 text-right">
                    <a href="https://${sub}" target="_blank" class="text-slate-600 hover:text-blue-500"><i class="fas fa-external-link-alt"></i></a>
                </td>
            `;
            document.getElementById('dataTable').appendChild(row);

            try {
                // DNS Resolution
                const dnsRes = await fetch(`https://dns.google/resolve?name=${sub}&type=A`);
                const dnsData = await dnsRes.json();
                const ip = dnsData.Answer ? dnsData.Answer.find(a => a.type === 1)?.data : null;

                const ipEl = document.getElementById(`ip-${rowId}`);
                const provEl = document.getElementById(`provider-${rowId}`);
                const statEl = document.getElementById(`status-${rowId}`);

                if (ip) {
                    ipEl.textContent = ip;
                    
                    // Detailed Provider Lookup (IP-API or similar)
                    lookupProvider(ip, provEl);
                    
                    // Live Status Check
                    checkLiveStatus(sub, statEl);
                } else {
                    ipEl.textContent = "N/A";
                    provEl.textContent = "-";
                    statEl.innerHTML = `<i class="fas fa-minus text-slate-800"></i>`;
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function lookupProvider(ip, el) {
            try {
                // Hardcoded range checks for speed first
                const cfRanges = ['172.64', '104.16', '104.17', '104.18', '104.19', '104.20', '104.21', '172.67', '108.162'];
                const cwRanges = ['13.224', '13.225', '13.226', '13.227', '13.32', '18.64', '52.84', '54.192'];

                if (cfRanges.some(r => ip.startsWith(r))) {
                    el.innerHTML = `<span class="px-2 py-1 rounded text-[10px] font-black cf-badge">CLOUDFLARE</span>`;
                    return;
                }
                if (cwRanges.some(r => ip.startsWith(r))) {
                    el.innerHTML = `<span class="px-2 py-1 rounded text-[10px] font-black aws-badge">CLOUDFRONTS</span>`;
                    return;
                }

                // If not CF/AWS, do a real WHOIS/ISP lookup
                const res = await fetch(`https://ipapi.co/${ip}/json/`);
                const data = await res.json();
                
                if (data.org) {
                    el.innerHTML = `<span class="px-2 py-1 rounded text-[10px] font-black provider-badge">${data.org.toUpperCase()}</span>`;
                } else {
                    el.innerHTML = `<span class="px-2 py-1 rounded text-[10px] font-black direct-badge">UNKNOWN ISP</span>`;
                }
            } catch (e) {
                el.innerHTML = `<span class="px-2 py-1 rounded text-[10px] font-black direct-badge">DIRECT IP</span>`;
            }
        }

        async function checkLiveStatus(sub, el) {
            try {
                const controller = new AbortController();
                setTimeout(() => controller.abort(), 8000);
                
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://' + sub)}`, { 
                    method: 'GET',
                    signal: controller.signal
                });
                
                if (res.ok) {
                    el.innerHTML = `<i class="fas fa-check-circle status-online" title="Online"></i>`;
                } else {
                    el.innerHTML = `<i class="fas fa-exclamation-circle text-orange-500" title="Restricted"></i>`;
                }
            } catch (e) {
                el.innerHTML = `<i class="fas fa-times-circle status-offline" title="Offline"></i>`;
            }
        }

        function showAlert(msg, type) {
            const box = document.getElementById('alertBox');
            box.textContent = msg;
            box.className = `mb-8 p-6 rounded-2xl border-2 text-center font-bold ${type === 'error' ? 'bg-red-500/10 text-red-500 border-red-500/20' : 'bg-yellow-500/10 text-yellow-500 border-yellow-500/20'}`;
            box.classList.remove('hidden');
        }
    </script>
</body>
</html>
