<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subdomain Finder Pro - Cloudflare Detection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .main-gradient { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .animate-spin-slow { animation: spin 3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 2s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="min-h-screen text-slate-900">

    <!-- Top Banner -->
    <div class="main-gradient h-64 w-full absolute top-0 left-0 -z-10 rounded-b-[3rem]"></div>

    <div class="max-w-4xl mx-auto px-4 py-12">
        <!-- Header -->
        <div class="text-center mb-10 text-white">
            <h1 class="text-4xl font-extrabold mb-3 tracking-tight">Subdomain Scout Pro</h1>
            <p class="text-blue-100 opacity-90">Deep reconnaissance tool for subdomains & infrastructure</p>
        </div>

        <!-- Main Search Card -->
        <div class="glass-card p-8 rounded-[2.5rem] shadow-2xl mb-8">
            <div class="flex flex-col md:flex-row gap-4 mb-8">
                <div class="relative flex-1">
                    <i class="fas fa-globe absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="domainInput" placeholder="ဥပမာ - dtac.co.th" 
                        class="w-full pl-12 pr-6 py-4 rounded-2xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-blue-500 outline-none transition-all text-lg shadow-sm bg-white">
                </div>
                <button id="scanBtn" onclick="initiateScan()" 
                    class="main-gradient text-white px-10 py-4 rounded-2xl font-bold text-lg hover:shadow-xl hover:shadow-blue-200 transition-all flex items-center justify-center gap-3 active:scale-95 disabled:opacity-70">
                    <span id="btnText">Scan Domain</span>
                    <i id="loadingIcon" class="fas fa-circle-notch animate-spin hidden"></i>
                </button>
            </div>

            <!-- Usage Guide -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-6 border-t border-slate-100">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600"><i class="fas fa-search"></i></div>
                    <div class="text-xs text-slate-500 font-medium">Auto Discovery via Search</div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-orange-50 flex items-center justify-center text-orange-600"><i class="fas fa-shield-halved"></i></div>
                    <div class="text-xs text-slate-500 font-medium">Cloudflare/WAF Detection</div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center text-emerald-600"><i class="fas fa-map-location-dot"></i></div>
                    <div class="text-xs text-slate-500 font-medium">Infrastructure Mapping</div>
                </div>
            </div>
        </div>

        <!-- Status & Error Alert -->
        <div id="statusBox" class="hidden p-5 rounded-2xl text-center font-bold border-2 mb-8 animate-pulse"></div>

        <!-- Results Display -->
        <div id="resultsArea" class="hidden">
            <div class="bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden mb-8">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-100">
                                <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Subdomain</th>
                                <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">IP Address</th>
                                <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Provider</th>
                            </tr>
                        </thead>
                        <tbody id="resultsList" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>

            <!-- Source Grounding -->
            <div id="sourcesBox" class="hidden p-8 bg-white rounded-[2rem] border border-slate-100 shadow-sm">
                <h4 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fas fa-link text-blue-600"></i> Discovery Sources
                </h4>
                <div id="sourcesItems" class="flex flex-wrap gap-2"></div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; // Managed by environment

        async function initiateScan() {
            const domain = document.getElementById('domainInput').value.trim();
            if (!domain) {
                showAlert("Please enter a domain name.", "bg-rose-50 text-rose-600 border-rose-100");
                return;
            }

            const btn = document.getElementById('scanBtn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loadingIcon');
            const resultsArea = document.getElementById('resultsArea');
            const list = document.getElementById('resultsList');

            // Reset
            btn.disabled = true;
            btnText.innerText = "Analyzing...";
            loader.classList.remove('hidden');
            resultsArea.classList.add('hidden');
            document.getElementById('statusBox').classList.add('hidden');
            list.innerHTML = '';

            const sysPrompt = `You are a cybersecurity intelligence tool. 
            Search for all valid subdomains of the provided domain.
            1. Find the subdomains.
            2. Extract their public IP addresses.
            3. Detect if they use Cloudflare, AWS Cloudfront, Akamai, or direct hosting.
            4. If Cloudflare IPs are found, explicitly tag infra as "Cloudflare".
            
            Return ONLY a valid JSON: {"subdomains": [{"name": "...", "ip": "...", "infra": "..."}]}`;

            const userPrompt = `Scan for subdomains and identify cloud infrastructure for: ${domain}`;

            async function fetchData(retries = 3) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userPrompt }] }],
                            systemInstruction: { parts: [{ text: sysPrompt }] },
                            tools: [{ "google_search": {} }]
                        })
                    });

                    if (response.status === 403) {
                        throw new Error("Access Denied (403). Try running this as a local HTML file instead of inside an editor.");
                    }
                    if (!response.ok) throw new Error("Connection failed. Please check your internet.");

                    const data = await response.json();
                    const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    
                    // JSON Extraction
                    const jsonMatch = textResponse.match(/\{[\s\S]*\}/);
                    if (!jsonMatch) throw new Error("Analysis failed. Try a different domain.");

                    const results = JSON.parse(jsonMatch[0]);
                    const sources = data.candidates?.[0]?.groundingMetadata?.groundingAttributions || [];
                    
                    render(results.subdomains || [], sources);

                } catch (err) {
                    if (retries > 0 && !err.message.includes("403")) {
                        await new Promise(r => setTimeout(r, 2000));
                        return fetchData(retries - 1);
                    }
                    showAlert(err.message, "bg-rose-50 text-rose-600 border-rose-100");
                } finally {
                    btn.disabled = false;
                    btnText.innerText = "Scan Domain";
                    loader.classList.add('hidden');
                }
            }

            fetchData();
        }

        function render(items, sources) {
            const list = document.getElementById('resultsList');
            const area = document.getElementById('resultsArea');
            const sourcesBox = document.getElementById('sourcesBox');
            const sourcesItems = document.getElementById('sourcesItems');

            if (items.length === 0) {
                showAlert("No subdomains discovered.", "bg-amber-50 text-amber-700 border-amber-100");
                return;
            }

            items.forEach(item => {
                const infra = (item.infra || '').toLowerCase();
                let badgeStyle = "bg-slate-100 text-slate-600 border-slate-200";
                
                if (infra.includes('cloudflare')) badgeStyle = "bg-orange-50 text-orange-600 border-orange-200";
                else if (infra.includes('amazon') || infra.includes('cloudfront')) badgeStyle = "bg-blue-50 text-blue-600 border-blue-200";
                else if (infra.includes('google')) badgeStyle = "bg-emerald-50 text-emerald-600 border-emerald-200";

                const row = `
                    <tr class="hover:bg-slate-50/80 transition-all">
                        <td class="px-8 py-5 font-bold text-blue-600 break-all text-sm">${item.name}</td>
                        <td class="px-8 py-5 text-slate-500 font-mono text-xs">${item.ip || '—'}</td>
                        <td class="px-8 py-5">
                            <span class="px-3 py-1.5 rounded-lg text-[9px] font-black uppercase border ${badgeStyle}">
                                ${item.infra || 'Direct'}
                            </span>
                        </td>
                    </tr>
                `;
                list.innerHTML += row;
            });

            if (sources.length > 0) {
                sourcesItems.innerHTML = '';
                sources.forEach(s => {
                    if (s.web) {
                        const link = `<a href="${s.web.uri}" target="_blank" class="px-3 py-1.5 bg-slate-50 text-[10px] font-bold text-slate-500 rounded-lg border border-slate-100 hover:bg-blue-50 hover:text-blue-600 transition-all">${s.web.title}</a>`;
                        sourcesItems.innerHTML += link;
                    }
                });
                sourcesBox.classList.remove('hidden');
            }

            area.classList.remove('hidden');
        }

        function showAlert(msg, classes) {
            const box = document.getElementById('statusBox');
            box.innerText = msg;
            box.className = `p-5 rounded-2xl text-center font-bold border-2 mb-8 ${classes}`;
            box.classList.remove('hidden');
        }
    </script>
</body>
</html>
