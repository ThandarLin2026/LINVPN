<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP & Hostname Toolkit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu&display=swap');
        body { font-family: 'Pyidaungsu', sans-serif; }
        #map { height: 300px; border-radius: 0.75rem; }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-10">

    <nav class="bg-blue-600 text-white p-4 shadow-lg mb-6">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">IP Toolkit</h1>
            <span class="text-sm opacity-90">Hostname & IP Info</span>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 space-y-6">
        
        <!-- User's IP Info Section -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">သင့်ရဲ့ လက်ရှိ IP အချက်အလက်များ</h2>
            <div id="user-ip-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-3">
                    <div class="flex justify-between p-3 bg-slate-50 rounded-lg">
                        <span class="text-slate-500">IP Address:</span>
                        <span id="u-ip" class="font-mono font-bold text-blue-600">Loading...</span>
                    </div>
                    <div class="flex justify-between p-3 bg-slate-50 rounded-lg">
                        <span class="text-slate-500">တည်နေရာ:</span>
                        <span id="u-location" class="font-semibold text-slate-700">-</span>
                    </div>
                    <div class="flex justify-between p-3 bg-slate-50 rounded-lg">
                        <span class="text-slate-500">Provider (ISP):</span>
                        <span id="u-isp" class="font-semibold text-slate-700">-</span>
                    </div>
                </div>
                <div>
                    <div id="map"></div>
                </div>
            </div>
        </section>

        <!-- Hostname to IP Section -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Hostname မှ IP ရှာဖွေရန်</h2>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="hostname-input" placeholder="ဥပမာ- google.com" 
                    class="flex-1 p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                <button onclick="lookupHostname()" id="lookup-btn"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold transition-all flex items-center justify-center gap-2">
                    ရှာဖွေမည်
                </button>
            </div>
            
            <div id="lookup-result" class="mt-6 hidden">
                <div class="p-4 bg-blue-50 border border-blue-100 rounded-xl">
                    <p class="text-sm text-blue-600 mb-1">ရှာဖွေတွေ့ရှိသည့် IP Address:</p>
                    <div class="flex items-center justify-between">
                        <span id="result-ip" class="text-2xl font-mono font-bold text-blue-900"></span>
                        <button onclick="copyToClipboard()" class="text-xs bg-white border px-2 py-1 rounded shadow-sm hover:bg-slate-50">Copy</button>
                    </div>
                </div>
            </div>

            <div id="error-box" class="mt-4 p-4 bg-red-50 text-red-600 rounded-xl hidden"></div>
        </section>

    </main>

    <script>
        const apiKey = ""; // Gemini API Key will be handled by the environment
        let map;
        let marker;

        // Initialize Map
        function initMap(lat, lon) {
            if (map) {
                map.setView([lat, lon], 13);
                marker.setLatLng([lat, lon]);
            } else {
                map = L.map('map').setView([lat, lon], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap'
                }).addTo(map);
                marker = L.marker([lat, lon]).addTo(map);
            }
        }

        // Get User IP Information on Load
        async function fetchUserIP() {
            try {
                // Using ip-api.com for location and provider (Free for non-commercial)
                const response = await fetch('http://ip-api.com/json/');
                const data = await response.json();

                if (data.status === 'success') {
                    document.getElementById('u-ip').innerText = data.query;
                    document.getElementById('u-location').innerText = `${data.city}, ${data.country}`;
                    document.getElementById('u-isp').innerText = data.isp;
                    initMap(data.lat, data.lon);
                } else {
                    document.getElementById('u-ip').innerText = "Error fetching data";
                }
            } catch (error) {
                document.getElementById('u-ip').innerText = "Connection Error";
                console.error(error);
            }
        }

        // Hostname Lookup via Gemini API (as a tool to resolve hostnames)
        async function lookupHostname() {
            const hostname = document.getElementById('hostname-input').value.trim();
            const btn = document.getElementById('lookup-btn');
            const resultBox = document.getElementById('lookup-result');
            const errorBox = document.getElementById('error-box');

            if (!hostname) return;

            // UI Reset
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> ရှာဖွေနေသည်...';
            resultBox.classList.add('hidden');
            errorBox.classList.add('hidden');

            const prompt = `What is the public IPv4 address for the hostname: ${hostname}? Return ONLY the IP address. If it's invalid, return "INVALID".`;

            let retries = 0;
            const maxRetries = 5;

            async function callGemini() {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            tools: [{ "google_search": {} }] // Use search to get live IP info
                        })
                    });

                    if (!response.ok) throw new Error('API Error');

                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || "";
                    
                    // Simple Regex to validate IP from AI response
                    const ipMatch = text.match(/\b(?:\d{1,3}\.){3}\d{1,3}\b/);

                    if (ipMatch) {
                        document.getElementById('result-ip').innerText = ipMatch[0];
                        resultBox.classList.remove('hidden');
                    } else {
                        throw new Error('Hostname ရှာမတွေ့ပါ။ စာလုံးပေါင်းပြန်စစ်ပေးပါ။');
                    }

                } catch (err) {
                    if (retries < maxRetries) {
                        const delay = Math.pow(2, retries) * 1000;
                        retries++;
                        setTimeout(callGemini, delay);
                    } else {
                        errorBox.innerText = err.message || "အမှားတစ်ခုရှိနေပါသည်။ နောက်မှပြန်ကြိုးစားပါ။";
                        errorBox.classList.remove('hidden');
                    }
                } finally {
                    btn.disabled = false;
                    btn.innerText = 'ရှာဖွေမည်';
                }
            }

            callGemini();
        }

        function copyToClipboard() {
            const text = document.getElementById('result-ip').innerText;
            const tempInput = document.createElement("input");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            
            const btn = document.querySelector('#lookup-result button');
            const originalText = btn.innerText;
            btn.innerText = "Copied!";
            setTimeout(() => btn.innerText = originalText, 2000);
        }

        window.onload = fetchUserIP;
    </script>
</body>
</html>
