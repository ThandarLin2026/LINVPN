<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Support - Live Messaging</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; overflow: hidden; height: 100dvh; display: flex; flex-direction: column; background: #f8fafc; }
        .user-msg { background: #2563eb; color: white; border-radius: 18px 18px 0 18px; }
        .admin-msg { background: #e2e8f0; color: #1e293b; border-radius: 18px 18px 18px 0; }
        .active-user-card { background: #eff6ff; border-left: 4px solid #2563eb; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .status-online { background-color: #22c55e; }
        .status-offline { background-color: #94a3b8; }
        .input-area { background: white; padding-bottom: env(safe-area-inset-bottom, 12px); border-top: 1px solid #e2e8f0; z-index: 50; }
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid #2563eb; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            .sidebar { width: 100% !important; display: none; position: absolute; inset: 0; z-index: 40; background: white; }
            .sidebar.active { display: flex; }
            .chat-main { width: 100% !important; display: none; }
            .chat-main.active { display: flex; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <nav class="bg-white border-b px-4 py-2 flex justify-between items-center z-50 shrink-0 shadow-sm">
        <div class="flex items-center space-x-2 text-blue-600">
            <i class="fas fa-comments text-2xl"></i>
            <span class="font-bold text-lg tracking-tight uppercase">Support</span>
        </div>
        <div class="flex bg-slate-100 p-1 rounded-xl">
            <button onclick="switchView('user')" id="tab-user" class="text-xs font-bold px-4 py-1.5 rounded-lg bg-white shadow text-blue-600">User</button>
            <button onclick="switchView('admin')" id="tab-admin" class="text-xs font-bold px-4 py-1.5 rounded-lg text-slate-500">Admin</button>
        </div>
    </nav>

    <!-- USER VIEW -->
    <div id="user-view" class="flex-1 flex flex-col max-w-xl mx-auto bg-white shadow-lg w-full overflow-hidden relative border-x">
        <div class="bg-blue-600 p-4 text-white flex items-center justify-between shrink-0 shadow-md">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center font-bold">S</div>
                    <div id="admin-status-dot" class="absolute bottom-0 right-0 w-3 h-3 border-2 border-blue-600 rounded-full status-offline"></div>
                </div>
                <div>
                    <h2 class="font-bold text-sm">Customer Care</h2>
                    <p id="admin-status-text" class="text-[10px] opacity-80 font-bold uppercase">Connecting...</p>
                </div>
            </div>
            <span id="my-id-display" class="text-[10px] bg-black/20 px-2 py-1 rounded font-mono"></span>
        </div>
        
        <div id="user-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50 custom-scrollbar"></div>
        
        <!-- User Progress Message -->
        <div id="user-status-toast" class="hidden absolute bottom-20 left-1/2 -translate-x-1/2 bg-white px-4 py-2 rounded-full shadow-xl flex items-center space-x-2 text-xs font-bold z-[60] border">
            <div class="loader"></div>
            <span id="user-status-label" class="text-blue-600">Uploading...</span>
        </div>

        <div class="input-area p-3 flex items-center space-x-2">
            <input type="file" id="user-file-input" class="hidden" accept="image/*,video/*">
            <button onclick="document.getElementById('user-file-input').click()" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-blue-600"><i class="fas fa-plus"></i></button>
            <button id="user-record-btn" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-red-500 transition-colors"><i class="fas fa-microphone"></i></button>
            <input type="text" id="user-input" placeholder="စာရိုက်ပါ..." class="flex-1 bg-slate-100 rounded-full px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-blue-500/20">
            <button id="user-send-btn" class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-md active:scale-95"><i class="fas fa-paper-plane text-xs"></i></button>
        </div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="admin-view" class="hidden flex-1 flex overflow-hidden bg-white relative">
        <!-- Delete Modal -->
        <div id="delete-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm">
            <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-xs w-full text-center">
                <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-2xl mx-auto mb-4"><i class="fas fa-trash-alt"></i></div>
                <h3 class="font-bold text-lg mb-2">ဖျက်မှာ သေချာသလား?</h3>
                <div class="flex space-x-3 mt-6">
                    <button onclick="closeDeleteModal()" class="flex-1 py-3 bg-slate-100 rounded-xl font-bold text-slate-600">Cancel</button>
                    <button id="confirm-delete-btn" class="flex-1 py-3 bg-red-600 rounded-xl font-bold text-white">Delete</button>
                </div>
            </div>
        </div>

        <!-- Login -->
        <div id="admin-login-overlay" class="absolute inset-0 z-[60] flex items-center justify-center bg-slate-50 p-6">
            <div class="max-w-xs w-full bg-white p-8 rounded-3xl shadow-xl text-center border">
                <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4"><i class="fas fa-shield-alt"></i></div>
                <h2 class="font-bold text-xl mb-4">Admin Dashboard</h2>
                <input type="password" id="admin-pass-input" placeholder="Password" class="w-full border rounded-xl px-4 py-3 mb-4 text-center outline-none">
                <button id="admin-login-btn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">Unlock</button>
                <p id="login-error" class="text-red-500 text-xs mt-4 hidden">Password မှားနေပါသည်။</p>
            </div>
        </div>

        <div id="admin-content" class="flex-1 flex opacity-0 transition-opacity duration-300">
            <div id="admin-sidebar" class="sidebar active w-80 border-r flex flex-col shrink-0 bg-white">
                <div class="p-4 border-b font-bold flex justify-between items-center bg-slate-50">
                    <span class="text-slate-800">Messages</span>
                    <button onclick="logoutAdmin()" class="text-slate-400 hover:text-red-500"><i class="fas fa-sign-out-alt"></i></button>
                </div>
                <div id="admin-user-list" class="flex-1 overflow-y-auto custom-scrollbar"></div>
            </div>

            <div id="admin-chat-main" class="chat-main flex-1 flex flex-col bg-slate-50">
                <div class="p-4 bg-white border-b flex items-center justify-between shrink-0">
                    <div class="flex items-center">
                        <button onclick="toggleSidebar(true)" class="md:hidden mr-3 text-slate-500 w-9 h-9 flex items-center justify-center bg-slate-100 rounded-full"><i class="fas fa-chevron-left"></i></button>
                        <div class="relative">
                            <div id="active-user-avatar" class="w-10 h-10 bg-slate-800 text-white rounded-xl flex items-center justify-center font-bold mr-3 hidden">?</div>
                            <div id="chat-header-status" class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 border-2 border-white rounded-full hidden"></div>
                        </div>
                        <div>
                            <span id="admin-chat-title" class="font-bold text-slate-800 text-sm">User တစ်ယောက်ရွေးပါ</span>
                            <p id="active-user-status-text" class="text-[10px] text-slate-400 font-bold uppercase"></p>
                        </div>
                    </div>
                </div>
                
                <div id="admin-messages" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar"></div>

                <!-- Admin Progress Message -->
                <div id="admin-status-toast" class="hidden absolute bottom-20 left-1/2 -translate-x-1/2 bg-white px-4 py-2 rounded-full shadow-xl flex items-center space-x-2 text-xs font-bold z-[60] border">
                    <div class="loader"></div>
                    <span id="admin-status-label" class="text-blue-600">Uploading...</span>
                </div>

                <div id="admin-input-area" class="input-area p-3 hidden">
                    <div class="flex items-center space-x-2">
                        <input type="file" id="admin-file-input" class="hidden" accept="image/*,video/*">
                        <button onclick="document.getElementById('admin-file-input').click()" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-blue-600"><i class="fas fa-plus"></i></button>
                        <button id="admin-record-btn" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-red-500"><i class="fas fa-microphone"></i></button>
                        <input type="text" id="admin-input" placeholder="အကြောင်းပြန်စာ..." class="flex-1 bg-slate-100 rounded-xl px-4 py-2.5 text-sm outline-none">
                        <button id="admin-send-btn" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-bold shadow-md active:scale-95">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <audio id="noti-sound" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, setDoc, doc, deleteDoc, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAHe6r3knYL9VjnzVmRgp bZB8MFaJH Qvd8".replace(/\s/g, ''),
            authDomain: "vc-chat-b9a42.firebaseapp.com",
            projectId: "vc-chat-b9a42",
            storageBucket: "vc-chat-b9a42.appspot.com",
            messagingSenderId: "78188750996",
            appId: "1:78188750996:web:3bc34993f9b37b0145b081"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const ADMIN_PASS = "JueHtet19991";
        let isAdminActive = false;
        let selectedUID = null;
        let currentView = 'user';
        let uidToDelete = null;

        // --- Persistent User ID ---
        let uid = localStorage.getItem('chat_v3_uid');
        if (!uid) {
            uid = 'USR-' + Math.floor(100000 + Math.random() * 900000);
            localStorage.setItem('chat_v3_uid', uid);
        }
        document.getElementById('my-id-display').innerText = "ID: " + uid;

        // Status Management
        const updatePresence = (status) => {
            const path = isAdminActive && currentView === 'admin' ? 'admin_status' : uid;
            setDoc(doc(db, "presence", path), { status, lastSeen: serverTimestamp() }, { merge: true }).catch(()=>{});
        };
        window.addEventListener('focus', () => updatePresence('online'));
        window.addEventListener('blur', () => updatePresence('offline'));
        updatePresence('online');

        // Notification sound
        const playNoti = () => {
            const audio = document.getElementById('noti-sound');
            audio.currentTime = 0;
            audio.play().catch(()=>{});
        };

        // Render Message Logic
        const renderMsg = (m, senderType) => {
            const isMe = m.sender === senderType;
            const containerClass = `flex ${isMe ? 'justify-end' : 'justify-start'}`;
            const msgClass = isMe ? 'user-msg shadow-blue-200' : 'admin-msg shadow-slate-200';
            
            let contentHtml = '';
            if (m.type === 'text') {
                contentHtml = `<div class="p-3 max-w-[85%] text-sm shadow-sm ${msgClass}">${m.content}</div>`;
            } else if (m.type === 'image') {
                contentHtml = `<div class="max-w-[80%] rounded-xl overflow-hidden border-2 border-white shadow-md bg-white">
                                <img src="${m.content}" class="w-full h-auto cursor-zoom-in" loading="lazy" onclick="window.open('${m.content}')">
                               </div>`;
            } else if (m.type === 'video') {
                contentHtml = `<div class="max-w-[80%] rounded-xl overflow-hidden border-2 border-white shadow-md bg-black">
                                <video src="${m.content}" controls class="w-full h-auto"></video>
                               </div>`;
            } else if (m.type === 'audio') {
                contentHtml = `<div class="p-2 ${msgClass} rounded-2xl flex items-center shadow-sm">
                                <audio controls src="${m.content}" class="max-w-[180px] h-8"></audio>
                               </div>`;
            }

            return `<div class="${containerClass} animate-in slide-in-from-bottom-2 duration-300">${contentHtml}</div>`;
        };

        // UI Helpers
        const showStatus = (sender, label, isError = false) => {
            const toast = document.getElementById(`${sender}-status-toast`);
            const text = document.getElementById(`${sender}-status-label`);
            toast.classList.remove('hidden');
            text.innerText = label;
            text.className = isError ? 'text-red-600' : 'text-blue-600';
            if (isError) setTimeout(() => toast.classList.add('hidden'), 3000);
        };
        const hideStatus = (sender) => document.getElementById(`${sender}-status-toast`).classList.add('hidden');

        // Upload and Send Data
        async function uploadAndSend(sender, tid, file, type) {
            showStatus(sender, "Uploading...");
            try {
                // Firebase Rules must be open for this to work
                const sRef = ref(storage, `chat_media/${tid}/${Date.now()}_${file.name || 'voice.webm'}`);
                const snapshot = await uploadBytes(sRef, file);
                const url = await getDownloadURL(snapshot.ref);
                
                await addDoc(collection(db, "chats", tid, "messages"), {
                    sender, content: url, type, timestamp: serverTimestamp()
                });
                
                await setDoc(doc(db, "chats", tid), {
                    lastUpdate: serverTimestamp(),
                    userId: tid,
                    lastSender: sender,
                    lastText: `Sent a ${type}`
                }, { merge: true });
                
                hideStatus(sender);
            } catch (err) {
                console.error("Upload Error:", err);
                showStatus(sender, "Upload Failed. Check Firebase Rules!", true);
            }
        }

        async function sendText(sender, tid, text) {
            try {
                await addDoc(collection(db, "chats", tid, "messages"), {
                    sender, content: text, type: 'text', timestamp: serverTimestamp()
                });
                await setDoc(doc(db, "chats", tid), {
                    lastUpdate: serverTimestamp(),
                    userId: tid,
                    lastSender: sender,
                    lastText: text
                }, { merge: true });
            } catch (e) { console.error(e); }
        }

        // Voice Message Logic (Optimized)
        const setupVoice = (btnId, sender) => {
            const btn = document.getElementById(btnId);
            let mediaRec; let chunks = [];
            
            btn.onclick = async () => {
                const targetId = (sender === 'user') ? uid : selectedUID;
                if (!targetId) return;

                if (!mediaRec || mediaRec.state === 'inactive') {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        // Try different mime types for browser compatibility
                        const options = { mimeType: MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/ogg' };
                        mediaRec = new MediaRecorder(stream, options);
                        chunks = [];
                        
                        mediaRec.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
                        mediaRec.onstop = () => {
                            const blob = new Blob(chunks, { type: options.mimeType });
                            if (blob.size > 0) {
                                uploadAndSend(sender, targetId, blob, 'audio');
                            }
                            btn.classList.remove('text-red-500', 'animate-pulse');
                        };
                        
                        mediaRec.start();
                        btn.classList.add('text-red-500', 'animate-pulse');
                    } catch (e) { 
                        alert("Microphone Access Required!"); 
                    }
                } else {
                    mediaRec.stop();
                    mediaRec.stream.getTracks().forEach(t => t.stop());
                }
            };
        };
        setupVoice('user-record-btn', 'user');
        setupVoice('admin-record-btn', 'admin');

        // File Selection Handlers
        document.getElementById('user-file-input').onchange = (e) => {
            const f = e.target.files[0];
            if (f) uploadAndSend('user', uid, f, f.type.startsWith('image/') ? 'image' : 'video');
            e.target.value = '';
        };
        document.getElementById('admin-file-input').onchange = (e) => {
            const f = e.target.files[0];
            if (f && selectedUID) uploadAndSend('admin', selectedUID, f, f.type.startsWith('image/') ? 'image' : 'video');
            e.target.value = '';
        };

        // User Chat Subscription
        onSnapshot(query(collection(db, "chats", uid, "messages"), orderBy("timestamp", "asc")), snap => {
            const box = document.getElementById('user-messages');
            box.innerHTML = '';
            snap.forEach(d => { box.innerHTML += renderMsg(d.data(), 'user'); });
            box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
        });

        // Admin Logics
        window.switchView = (v) => {
            currentView = v;
            document.getElementById('user-view').classList.toggle('hidden', v === 'admin');
            document.getElementById('admin-view').classList.toggle('hidden', v === 'user');
            updatePresence('online');
        };

        document.getElementById('admin-login-btn').onclick = () => {
            if(document.getElementById('admin-pass-input').value === ADMIN_PASS) {
                document.getElementById('admin-login-overlay').classList.add('hidden');
                document.getElementById('admin-content').classList.replace('opacity-0', 'opacity-100');
                isAdminActive = true;
                updatePresence('online');
            } else { document.getElementById('login-error').classList.remove('hidden'); }
        };

        // Chat List and Presence Subscriptions
        let chatDocs = [];
        let presenceMap = {};
        onSnapshot(collection(db, "chats"), snap => {
            chatDocs = snap.docs.map(d => d.data()).sort((a,b) => (b.lastUpdate?.seconds || 0) - (a.lastUpdate?.seconds || 0));
            refreshUserList();
            const last = chatDocs[0];
            if(isAdminActive && last?.lastSender === 'user' && last?.userId !== selectedUID) playNoti();
        });
        onSnapshot(collection(db, "presence"), snap => {
            snap.forEach(d => presenceMap[d.id] = d.data().status);
            refreshUserList();
            if(selectedUID) updateAdminHeader();
        });

        function refreshUserList() {
            const list = document.getElementById('admin-user-list');
            list.innerHTML = '';
            chatDocs.forEach(u => {
                const isOnline = presenceMap[u.userId] === 'online';
                const div = document.createElement('div');
                div.className = `group p-4 cursor-pointer border-b flex items-center transition-all ${selectedUID===u.userId?'active-user-card':'hover:bg-slate-50'}`;
                div.innerHTML = `
                    <div class="w-11 h-11 bg-slate-800 text-white rounded-2xl flex items-center justify-center font-bold mr-3 relative shrink-0">
                        ${u.userId.slice(-1)}
                        <div class="absolute -bottom-0.5 -right-0.5 w-4 h-4 border-2 border-white rounded-full ${isOnline?'status-online':'status-offline'}"></div>
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-[11px] text-slate-700">${u.userId}</span>
                            ${u.lastSender==='user'?'<div class="w-2 h-2 bg-blue-600 rounded-full animate-pulse"></div>':''}
                        </div>
                        <p class="text-[10px] text-slate-400 truncate">${u.lastText||'...'}</p>
                    </div>
                    <button onclick="openDeleteModal('${u.userId}', event)" class="ml-2 w-8 h-8 flex items-center justify-center text-slate-300 hover:text-red-500 md:opacity-0 group-hover:opacity-100"><i class="fas fa-trash-alt text-xs"></i></button>
                `;
                div.onclick = () => { selectedUID = u.userId; loadAdminChat(u.userId); if(window.innerWidth < 768) toggleSidebar(false); };
                list.appendChild(div);
            });
        }

        let adminMsgUnsub = null;
        function loadAdminChat(tid) {
            document.getElementById('admin-chat-title').innerText = tid;
            document.getElementById('active-user-avatar').innerText = tid.slice(-1);
            document.getElementById('active-user-avatar').classList.remove('hidden');
            document.getElementById('admin-input-area').classList.remove('hidden');
            updateAdminHeader();
            
            if(adminMsgUnsub) adminMsgUnsub();
            adminMsgUnsub = onSnapshot(query(collection(db, "chats", tid, "messages"), orderBy("timestamp", "asc")), snap => {
                const box = document.getElementById('admin-messages');
                box.innerHTML = '';
                snap.forEach(d => box.innerHTML += renderMsg(d.data(), 'admin'));
                box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
                // Mark as read by admin
                if(isAdminActive) setDoc(doc(db, "chats", tid), { lastSender: 'admin' }, { merge: true });
            });
        }

        function updateAdminHeader() {
            const isOnline = presenceMap[selectedUID] === 'online';
            const dot = document.getElementById('chat-header-status');
            dot.className = `absolute -bottom-1 -right-0.5 w-3.5 h-3.5 border-2 border-white rounded-full ${isOnline?'status-online':'status-offline'}`;
            dot.classList.remove('hidden');
            document.getElementById('active-user-status-text').innerText = isOnline ? 'ACTIVE' : 'OFFLINE';
        }

        document.getElementById('user-send-btn').onclick = () => {
            const el = document.getElementById('user-input');
            if(el.value.trim()) { sendText('user', uid, el.value); el.value = ''; }
        };
        document.getElementById('admin-send-btn').onclick = () => {
            const el = document.getElementById('admin-input');
            if(el.value.trim() && selectedUID) { sendText('admin', selectedUID, el.value); el.value = ''; }
        };

        window.toggleSidebar = (s) => {
            document.getElementById('admin-sidebar').classList.toggle('active', s);
            document.getElementById('admin-chat-main').classList.toggle('active', !s);
        };

        window.openDeleteModal = (id, e) => { e.stopPropagation(); uidToDelete = id; document.getElementById('delete-modal').classList.remove('hidden'); };
        window.closeDeleteModal = () => document.getElementById('delete-modal').classList.add('hidden');
        document.getElementById('confirm-delete-btn').onclick = async () => {
            const t = uidToDelete; closeDeleteModal();
            const msgs = await getDocs(collection(db, "chats", t, "messages"));
            const batch = writeBatch(db);
            msgs.forEach(d => batch.delete(d.ref));
            await batch.commit();
            await deleteDoc(doc(db, "chats", t));
            if(selectedUID === t) { selectedUID = null; document.getElementById('admin-input-area').classList.add('hidden'); }
        };

        window.logoutAdmin = () => { isAdminActive = false; document.getElementById('admin-login-overlay').classList.remove('hidden'); };
        
        // Listen for Admin Online status for User display
        onSnapshot(doc(db, "presence", "admin_status"), (d) => {
            const data = d.data();
            const dot = document.getElementById('admin-status-dot');
            const text = document.getElementById('admin-status-text');
            const isOnline = data?.status === 'online';
            dot.className = `absolute bottom-0 right-0 w-3 h-3 border-2 border-blue-600 rounded-full ${isOnline?'status-online':'status-offline'}`;
            text.innerText = isOnline ? "Online" : "Offline";
        });
    </script>
</body>
</html>
