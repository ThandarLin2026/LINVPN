<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2-PREMIUM Official Stable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc, addDoc, collection, deleteDoc, increment, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCLvS9xY6sUTPjk8uf0xUzeD4_UqRLWveI",
          authDomain: "topup-v2ray.firebaseapp.com",
          projectId: "topup-v2ray",
          storageBucket: "topup-v2ray.firebasestorage.app",
          messagingSenderId: "212562121085",
          appId: "1:212562121085:web:88b69e4418d0890d973c14"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const TG_TOKEN = "8719916377:AAElljRpk4nk9aAJAFGtJ-tjyacw5GdjS80";
        const TG_CHAT_ID = "7848197948";

        let allServers = [];
        let currentUser = null;
        window.currentBalance = 0;

        // Permanent ID Logic
        onAuthStateChanged(auth, async (user) => {
            const idLabel = document.getElementById('display-uid');
            if (user) {
                currentUser = user;
                idLabel.innerText = "ID: " + user.uid.toUpperCase();
                loadUserData(user.uid);
                loadAppData();
            } else {
                // Persistent Anonymous Sign-in
                await signInAnonymously(auth);
            }
        });

        async function sendTelegram(msg) {
            try {
                await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TG_CHAT_ID, text: msg, parse_mode: 'HTML' })
                });
            } catch (e) { console.error("TG Error", e); }
        }

        function loadUserData(uid) {
            onSnapshot(doc(db, "users", uid), (d) => {
                if(d.exists()) {
                    window.currentBalance = d.data().balance || 0;
                    document.getElementById('user-balance').innerText = window.currentBalance + " THB";
                } else {
                    // Create new user record if not exists
                    setDoc(doc(db, "users", uid), { balance: 0, createdAt: serverTimestamp() });
                }
            }, (error) => {
                console.error("Firestore Error:", error);
            });
        }

        function loadAppData() {
            // Bank Settings
            onSnapshot(doc(db, "settings", "bank"), (d) => {
                if(d.exists()) {
                    const data = d.data();
                    document.getElementById('u-bank-name').innerText = data.name || "N/A";
                    document.getElementById('u-bank-no').innerText = data.number || "000-000-000";
                    document.getElementById('u-bank-holder').innerText = data.holder || "N/A";
                    if(data.logo) document.getElementById('u-bank-logo').src = data.logo;
                    if(data.qr) document.getElementById('u-bank-qr-img').src = data.qr;
                    
                    document.getElementById('adm-bank-logo').value = data.logo || "";
                    document.getElementById('adm-bank-name').value = data.name || "";
                    document.getElementById('adm-bank-no').value = data.number || "";
                    document.getElementById('adm-bank-holder').value = data.holder || "";
                    document.getElementById('adm-bank-qr').value = data.qr || "";
                }
            });

            // Servers Inventory
            onSnapshot(collection(db, "servers"), (snap) => {
                allServers = [];
                snap.forEach(d => {
                    allServers.push({id: d.id, ...d.data()});
                });
                updateStockUI();
                renderAdminServerList();
            }, (err) => console.error(err));

            // Topup Requests
            onSnapshot(collection(db, "topup_requests"), (snap) => {
                const list = document.getElementById('adm-req-list');
                list.innerHTML = `<h3 class="text-xs font-bold text-blue-400 mb-4 uppercase tracking-widest">Pending Requests</h3>`;
                snap.forEach(d => {
                    const r = d.data();
                    list.innerHTML += `
                        <div class="bg-slate-800 p-4 rounded-3xl border border-white/5 mb-4 space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="text-[10px] font-mono text-slate-400">${r.uid}</span>
                                <span class="bg-green-500/20 text-green-400 px-3 py-1 rounded-full text-[10px] font-bold">${r.amount} THB</span>
                            </div>
                            <img src="${r.slip}" class="w-full h-48 object-cover rounded-2xl cursor-pointer" onclick="window.open('${r.slip}')">
                            <div class="grid grid-cols-2 gap-2 pt-2">
                                <button onclick="approveTopup('${d.id}', '${r.uid}', ${r.amount})" class="bg-green-600 py-3 rounded-xl text-[10px] font-bold uppercase">Approve</button>
                                <button onclick="cancelTopup('${d.id}')" class="bg-red-600/20 text-red-500 py-3 rounded-xl text-[10px] font-bold uppercase border border-red-500/20">Cancel</button>
                            </div>
                        </div>`;
                });
            });
        }

        window.updateStockUI = () => {
            const country = document.getElementById('country-select').value;
            const filtered = allServers.filter(s => s.flag === country);
            const stockCount = filtered.length;
            
            document.getElementById('stock-badge').innerText = `STOCK: ${stockCount}`;
            const flagMap = {
                'th': 'https://flagcdn.com/w80/th.png',
                'sg': 'https://flagcdn.com/w80/sg.png'
            };
            document.getElementById('selected-flag-img').src = flagMap[country];
            
            const displayArea = document.getElementById('user-gen-area');
            if(stockCount > 0) {
                const firstServer = filtered[0];
                displayArea.innerHTML = `
                    <div class="bg-white/5 p-6 rounded-3xl border border-white/5 text-center space-y-5">
                        <div class="grid grid-cols-3 gap-2">
                            <div class="bg-black/40 p-3 rounded-2xl border border-white/5">
                                <div class="w-2 h-2 bg-green-500 rounded-full online-dot mx-auto mb-1"></div>
                                <p class="text-[8px] font-bold text-slate-500 uppercase">Status</p>
                                <p class="text-[9px] font-black text-green-400">ONLINE</p>
                            </div>
                            <div class="bg-black/40 p-3 rounded-2xl border border-white/5">
                                <i class="fas fa-signal text-[10px] text-blue-400 mb-1"></i>
                                <p class="text-[8px] font-bold text-slate-500 uppercase">Ping</p>
                                <p class="text-[9px] font-black text-blue-400">${Math.floor(Math.random()*40 + 20)}ms</p>
                            </div>
                            <div class="bg-black/40 p-3 rounded-2xl border border-white/5">
                                <i class="fas fa-plug text-[10px] text-purple-400 mb-1"></i>
                                <p class="text-[8px] font-bold text-slate-500 uppercase">Port</p>
                                <p class="text-[9px] font-black text-purple-400">${firstServer.port || '443'}</p>
                            </div>
                        </div>
                        <div class="space-y-4">
                            <button onclick="buyOneConfig('${country}')" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-xs uppercase shadow-xl shadow-blue-600/30">GENERATE CONFIG (50 THB)</button>
                            ${firstServer.note ? `<p class="text-[10px] font-bold text-blue-400 bg-blue-500/5 p-3 rounded-xl border border-blue-500/10 text-left"><i class="fas fa-info-circle mr-1"></i> ${firstServer.note}</p>` : ''}
                        </div>
                    </div>
                `;
            } else {
                displayArea.innerHTML = `
                    <div class="bg-red-500/5 p-10 rounded-3xl border border-red-500/10 text-center">
                        <i class="fas fa-box-open text-3xl text-red-500/20 mb-3"></i>
                        <p class="text-xs font-bold text-red-400 uppercase tracking-widest">Stock Out</p>
                    </div>
                `;
            }
        };

        window.renderAdminServerList = () => {
            const list = document.getElementById('adm-server-list');
            list.innerHTML = `<h3 class="text-xs font-bold text-green-400 mb-4 uppercase tracking-widest">Inventory List</h3>`;
            if (allServers.length === 0) {
                list.innerHTML += `<p class="text-slate-500 text-[10px] text-center py-4">No data</p>`;
            }
            allServers.forEach(s => {
                list.innerHTML += `
                    <div class="bg-slate-800/50 p-4 rounded-2xl border border-white/5 mb-2 flex justify-between items-center">
                        <div class="flex items-center gap-3 overflow-hidden">
                             <img src="https://flagcdn.com/w80/${s.flag}.png" class="w-6 h-6 rounded-full object-cover">
                             <div class="overflow-hidden">
                                <p class="text-xs font-bold text-white uppercase truncate">${s.name} :${s.port}</p>
                                <p class="text-[8px] text-slate-500 font-mono truncate">${s.id}</p>
                             </div>
                        </div>
                        <button onclick="deleteServer('${s.id}')" class="flex-shrink-0 w-10 h-10 flex items-center justify-center text-red-500 hover:bg-red-500/10 rounded-xl">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
            });
        };

        window.deleteServer = async (id) => {
            if(!confirm("Stock ထဲမှ ဖျက်မှာ သေချာပါသလား?")) return;
            try {
                await deleteDoc(doc(db, "servers", id));
            } catch (e) { alert(e.message); }
        };

        window.buyOneConfig = async (country) => {
            const price = 50;
            if (window.currentBalance < price) {
                return alert("Credit မလောက်ပါ။");
            }

            const targetServer = allServers.find(s => s.flag === country);
            if (!targetServer) return alert("Stock မရှိတော့ပါ။");

            if (!confirm(`${price} THB နှုတ်ယူပါမည်။`)) return;
            
            try {
                await updateDoc(doc(db, "users", currentUser.uid), { 
                    balance: increment(-price) 
                });
                
                await deleteDoc(doc(db, "servers", targetServer.id));
                
                document.getElementById('result-area').value = targetServer.config;
                document.getElementById('result-modal').classList.remove('hidden');

                setTimeout(() => {
                    document.getElementById('result-area').value = "Expired.";
                }, 300000);

            } catch(e) { alert(e.message); }
        };

        window.updateBankSettings = async () => {
            const data = {
                logo: document.getElementById('adm-bank-logo').value,
                name: document.getElementById('adm-bank-name').value,
                number: document.getElementById('adm-bank-no').value,
                holder: document.getElementById('adm-bank-holder').value,
                qr: document.getElementById('adm-bank-qr').value
            };
            await setDoc(doc(db, "settings", "bank"), data);
            alert("Updated!");
        };

        window.submitTopup = async () => {
            if(!window.slipImg) return alert("Slip တင်ပါ");
            const amt = document.getElementById('dep-amt').value;
            
            await addDoc(collection(db, "topup_requests"), {
                uid: currentUser.uid,
                amount: parseInt(amt),
                slip: window.slipImg,
                createdAt: serverTimestamp()
            });

            await sendTelegram(`🔔 <b>Topup Req</b>\nID: <code>${currentUser.uid}</code>\nAmt: <b>${amt} THB</b>`);
            alert("တင်ပြပြီးပါပြီ။");
            window.slipImg = null;
            document.getElementById('slip-preview-box').classList.add('hidden');
        };

        window.approveTopup = async (id, uid, amt) => {
            try {
                await updateDoc(doc(db, "users", uid), { balance: increment(amt) });
                await deleteDoc(doc(db, "topup_requests", id));
                await sendTelegram(`✅ <b>Approved</b>\nID: <code>${uid}</code>\nAmt: <b>${amt} THB</b>`);
                alert("Approved!");
            } catch(e) { alert(e.message); }
        };

        window.cancelTopup = async (id) => {
            if(!confirm("Cancel?")) return;
            await deleteDoc(doc(db, "topup_requests", id));
        };

        window.addServer = async () => {
            const name = document.getElementById('adm-sname').value;
            const conf = document.getElementById('adm-sconf').value;
            const port = document.getElementById('adm-sport').value;
            const note = document.getElementById('adm-snote').value;
            const flag = document.getElementById('adm-flag').value;

            if(!name || !conf) return alert("Fill all!");

            try {
                await addDoc(collection(db, "servers"), {
                    name: name,
                    flag: flag,
                    config: conf,
                    port: port || "443",
                    note: note || "",
                    createdAt: serverTimestamp()
                });
                alert("Stock Added!");
                document.getElementById('adm-sname').value = "";
                document.getElementById('adm-sconf').value = "";
                document.getElementById('adm-sport').value = "443";
                document.getElementById('adm-snote').value = "";
            } catch(e) { alert(e.message); }
        };

        window.handleFile = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                window.slipImg = ev.target.result;
                document.getElementById('slip-preview').src = ev.target.result;
                document.getElementById('slip-preview-box').classList.remove('hidden');
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        window.switchPage = (p) => {
            document.querySelectorAll('.page').forEach(el => el.classList.add('hidden'));
            document.getElementById(p + '-page').classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.replace('text-blue-500', 'text-slate-500'));
            const targetBtn = p === 'main' ? document.getElementById('nav-home') : document.getElementById('nav-admin');
            targetBtn.classList.replace('text-slate-500', 'text-blue-500');
        };

        window.copyConfig = () => {
            const area = document.getElementById('result-area');
            area.select();
            document.execCommand('copy');
            alert("Copied!");
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #020617; color: white; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-box { background: #0f172a; border: 1px solid #1e293b; color: white; padding: 14px; border-radius: 20px; width: 100%; outline: none; transition: all 0.3s; }
        .online-dot { animation: pulse 2s infinite; box-shadow: 0 0 10px rgba(34, 197, 94, 0.8); }
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.5; } 70% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.5; } }
        .page { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="pb-28">

    <div class="p-6 max-w-md mx-auto flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black italic tracking-tighter leading-none">V2-PREMIUM</h1>
            <span class="text-[10px] font-bold text-blue-500 tracking-[0.3em] uppercase">Official Stable</span>
        </div>
        <div id="display-uid" class="px-4 py-2 bg-slate-900/50 rounded-2xl text-[9px] font-mono text-blue-400 border border-blue-500/10 uppercase tracking-widest">LOADING...</div>
    </div>

    <!-- User Dashboard -->
    <div id="main-page" class="page max-w-md mx-auto px-4 space-y-6">
        <div class="glass p-8 rounded-[2.5rem] text-center border-b-4 border-blue-600 shadow-2xl relative overflow-hidden">
            <p class="text-[10px] text-slate-400 uppercase font-black tracking-widest mb-2">My Balance</p>
            <h1 id="user-balance" class="text-5xl font-black tracking-tighter">0 THB</h1>
        </div>

        <div class="glass p-6 rounded-[2.5rem] space-y-5">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img id="selected-flag-img" src="https://flagcdn.com/w80/th.png" class="w-8 h-8 rounded-full object-cover border-2 border-white/10" alt="flag">
                    <h2 class="text-xs font-black uppercase tracking-widest">Select Region</h2>
                </div>
                <span id="stock-badge" class="bg-blue-600/10 text-blue-400 text-[10px] px-4 py-1.5 rounded-full font-extrabold border border-blue-500/20">STOCK: 0</span>
            </div>
            
            <select id="country-select" onchange="updateStockUI()" class="input-box text-sm font-bold appearance-none cursor-pointer">
                <option value="th">THAILAND PREMIUM</option>
                <option value="sg">SINGAPORE GAMING</option>
            </select>

            <div id="user-gen-area" class="pt-2"></div>
        </div>

        <div class="glass p-6 rounded-[3rem] space-y-4 border border-white/5">
            <div class="flex items-center justify-between">
                <h2 class="text-[10px] font-black uppercase tracking-widest text-blue-400"><i class="fas fa-wallet mr-1"></i> Topup Funds</h2>
                <button onclick="document.getElementById('qr-modal').classList.remove('hidden')" class="text-[9px] font-bold text-slate-400 underline uppercase tracking-tighter">QR Code</button>
            </div>

            <div class="bg-black/30 p-5 rounded-[2rem] border border-white/5 flex items-center gap-4">
                <img id="u-bank-logo" src="https://cdn-icons-png.flaticon.com/512/2830/2830284.png" class="w-10 h-10 rounded-xl object-cover">
                <div class="overflow-hidden">
                    <p id="u-bank-name" class="text-[9px] font-bold text-blue-500 uppercase truncate"></p>
                    <p id="u-bank-no" class="text-base font-black font-mono tracking-tight"></p>
                    <p id="u-bank-holder" class="text-[8px] text-slate-500 font-bold uppercase truncate"></p>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <select id="dep-amt" class="input-box text-xs font-bold">
                    <option value="50">50 THB</option>
                    <option value="100">100 THB</option>
                    <option value="200">200 THB</option>
                    <option value="500">500 THB</option>
                </select>
                <label for="slip-file" class="bg-slate-800 flex items-center justify-center rounded-2xl cursor-pointer border border-white/5">
                    <i class="fas fa-upload mr-2 text-blue-400"></i> <span class="text-[10px] font-black uppercase">Slip</span>
                </label>
                <input type="file" id="slip-file" class="hidden" onchange="handleFile(event)" accept="image/*">
            </div>

            <div id="slip-preview-box" class="hidden">
                <img id="slip-preview" class="w-20 h-20 mx-auto object-cover rounded-2xl border-2 border-blue-500">
            </div>

            <button onclick="submitTopup()" class="w-full bg-blue-600 py-4 rounded-[1.5rem] font-black uppercase text-xs shadow-lg shadow-blue-600/30">Submit Topup Request</button>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-page" class="page hidden max-w-md mx-auto px-4 space-y-6">
        <h1 class="text-xl font-black uppercase italic">Admin Panel</h1>
        
        <div class="glass p-6 rounded-3xl space-y-4">
            <h3 class="text-[10px] font-black uppercase text-blue-400 tracking-widest">Bank Details</h3>
            <input id="adm-bank-logo" placeholder="Logo URL" class="input-box text-xs">
            <input id="adm-bank-name" placeholder="Bank Name" class="input-box text-xs">
            <input id="adm-bank-no" placeholder="Bank Number" class="input-box text-xs">
            <input id="adm-bank-holder" placeholder="Holder Name" class="input-box text-xs">
            <input id="adm-bank-qr" placeholder="QR Image URL" class="input-box text-xs">
            <button onclick="updateBankSettings()" class="w-full bg-blue-600 py-3 rounded-2xl font-black text-xs uppercase">Save Bank</button>
        </div>

        <div class="glass p-6 rounded-3xl space-y-4">
            <h3 class="text-[10px] font-black uppercase text-green-400 tracking-widest">New Stock</h3>
            <div class="grid grid-cols-2 gap-2">
                <select id="adm-flag" class="input-box text-xs font-bold">
                    <option value="th">THAILAND</option>
                    <option value="sg">SINGAPORE</option>
                </select>
                <input id="adm-sport" placeholder="Port" value="443" class="input-box text-xs">
                <input id="adm-sname" placeholder="Server Display Name" class="input-box text-xs col-span-2">
                <input id="adm-snote" placeholder="Dashboard Note (Optional)" class="input-box text-xs col-span-2">
                <textarea id="adm-sconf" placeholder="V2Ray Config String" class="input-box h-32 text-[10px] font-mono col-span-2"></textarea>
            </div>
            <button onclick="addServer()" class="w-full bg-white text-black py-3 rounded-2xl font-black text-xs uppercase">Add to Stock</button>
        </div>

        <div id="adm-server-list" class="glass p-6 rounded-3xl"></div>
        <div id="adm-req-list" class="pb-20"></div>
    </div>

    <!-- Modals -->
    <div id="qr-modal" class="fixed inset-0 bg-black/95 z-[110] flex items-center justify-center p-8 hidden">
        <div class="text-center space-y-6 max-w-xs w-full">
            <div class="bg-white p-4 rounded-[2.5rem] inline-block shadow-2xl">
                <img id="u-bank-qr-img" src="" class="w-64 rounded-2xl">
            </div>
            <button onclick="document.getElementById('qr-modal').classList.add('hidden')" class="w-full py-4 bg-white/10 rounded-2xl text-[10px] font-black uppercase tracking-widest">Close</button>
        </div>
    </div>

    <div id="result-modal" class="fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-6 hidden">
        <div class="glass w-full max-w-sm rounded-[3.5rem] p-8 space-y-6 text-center border border-white/10">
            <h2 class="text-xl font-black text-white uppercase italic">Config Generated!</h2>
            <textarea id="result-area" readonly class="input-box h-40 text-[10px] font-mono bg-black/50 p-4"></textarea>
            <button onclick="copyConfig()" class="w-full bg-blue-600 py-4 rounded-3xl font-black text-xs uppercase shadow-xl shadow-blue-600/30">Copy Config</button>
            <button onclick="document.getElementById('result-modal').classList.add('hidden')" class="text-[10px] font-bold text-slate-500 uppercase">Dismiss</button>
        </div>
    </div>

    <!-- Navigation -->
    <div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-72 glass rounded-[2.5rem] p-2 flex justify-between shadow-2xl z-50 border border-white/10">
        <button id="nav-home" onclick="switchPage('main')" class="nav-btn flex-1 p-4 text-blue-500"><i class="fas fa-home text-lg"></i></button>
        <button id="nav-admin" onclick="switchPage('admin')" class="nav-btn flex-1 p-4 text-slate-500"><i class="fas fa-shield-alt text-lg"></i></button>
        <button onclick="location.reload()" class="flex-1 p-4 text-slate-500"><i class="fas fa-sync-alt text-lg"></i></button>
    </div>

</body>
</html>
