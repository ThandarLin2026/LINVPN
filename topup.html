<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>V2-PREMIUM | Cloudinary Slip Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cloudinary Upload Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background: #020617; color: #f1f5f9; }
        .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 2rem; }
        .input-dark { background: #0f172a; border: 1px solid #1e293b; color: #f1f5f9; padding: 12px 16px; border-radius: 1.25rem; width: 100%; outline: none; }
        .tab-content { display: none; animation: fade 0.25s ease; }
        .tab-content.active { display: block; }
        @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .server-card.active-server { border-color: #3b82f6 !important; background: rgba(59,130,246,0.15) !important; }
        .image-70 { width: 70px; height: 70px; object-fit: cover; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="pb-28">

    <!-- Header -->
    <div class="pt-5 px-5 max-w-md mx-auto flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i class="fas fa-bolt text-blue-500 text-xl"></i>
            <h1 class="text-xl font-black bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">V2-PREMIUM</h1>
        </div>
        <div id="display-uid" class="text-[9px] font-mono bg-slate-900/80 px-3 py-1.5 rounded-full border border-white/5">
            <i class="fas fa-id-card mr-1"></i> <span>ID: ---</span>
        </div>
    </div>

    <!-- USER PANEL -->
    <div id="user-page" class="tab-content active max-w-md mx-auto px-4 mt-4 space-y-5">
        <div class="glass-card p-6 text-center">
            <p class="text-[11px] text-slate-400"><i class="fas fa-coins mr-1"></i> လက်ကျန်ငွေ</p>
            <h1 id="user-balance" class="text-4xl font-black">0 THB</h1>
        </div>

        <div class="glass-card p-5 space-y-4">
            <div class="flex justify-between">
                <h2 class="text-xs font-bold text-slate-400"><i class="fas fa-server mr-1"></i> ဆာဗာရွေးပါ</h2>
                <span class="text-[10px] bg-blue-600/20 text-blue-300 px-2 py-0.5 rounded-full">ကျန်: <span id="stock-count">0</span></span>
            </div>
            <div id="server-list" class="space-y-3 max-h-64 overflow-y-auto"></div>
            <button id="gen-btn" onclick="generateConfig()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold disabled:opacity-50">ထုတ်ယူမည် (50฿)</button>
            <div id="result-area" class="hidden space-y-3">
                <textarea id="config-output" readonly class="input-dark h-24 text-[10px] font-mono"></textarea>
                <button onclick="copyConfig()" class="w-full border border-blue-500/40 text-blue-400 py-3 rounded-xl text-xs font-bold">ကူးယူမည်</button>
            </div>
        </div>

        <!-- Deposit with Cloudinary -->
        <div class="glass-card p-5 space-y-5">
            <h2 class="text-xs font-black text-slate-400"><i class="fas fa-university mr-1"></i> ငွေဖြည့်သွင်းမည်</h2>
            <div class="bg-black/30 rounded-2xl p-4 text-center space-y-3">
                <div class="flex items-center justify-center gap-4 flex-wrap">
                    <div><img id="u-bank-logo" src="" class="image-70 bg-slate-800"></div>
                    <div class="text-left">
                        <p id="u-bank-name" class="text-blue-400 font-bold text-sm">----</p>
                        <p id="u-bank-no" class="text-xl font-mono font-black">XXXX XXXX XXXX</p>
                        <p id="u-bank-holder" class="text-[10px] text-slate-400">----</p>
                    </div>
                    <div><img id="u-bank-qr" src="" class="image-70 bg-slate-800"></div>
                </div>
            </div>
            <select id="dep-amt" class="input-dark">
                <option value="50">50 ဘတ်</option>
                <option value="100">100 ဘတ်</option>
                <option value="200">200 ဘတ်</option>
                <option value="500">500 ဘတ်</option>
            </select>
            
            <!-- Cloudinary Upload Button -->
            <button id="uploadSlipBtn" class="w-full bg-slate-700 hover:bg-slate-600 py-3 rounded-xl text-sm font-bold">
                <i class="fas fa-cloud-upload-alt mr-2"></i> ပြေစာပုံတင်ရန် (Cloudinary)
            </button>
            <div id="slipPreview" class="hidden mt-2 flex justify-center items-center gap-3">
                <img id="slipPreviewImg" class="w-16 h-16 rounded-xl border border-white/20 object-cover">
                <span id="slipUrlDisplay" class="text-[8px] text-slate-400 truncate"></span>
            </div>
            <button id="submitDepositBtn" class="w-full bg-emerald-700 hover:bg-emerald-600 py-4 rounded-xl font-black text-sm" disabled>လျှောက်ထားမည်</button>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="admin-page" class="tab-content max-w-md mx-auto px-4 space-y-5 pt-4 pb-8">
        <h2 class="text-xl font-black text-center text-blue-500">ADMIN PANEL</h2>
        
        <div class="glass-card p-5 space-y-4 border-l-4 border-amber-500">
            <h3 class="text-xs font-bold text-amber-400">ဆိုင်းငံ့ထားသော ငွေဖြည့်မှုများ</h3>
            <div id="adm-req-list" class="space-y-3 max-h-72 overflow-y-auto"></div>
        </div>

        <div class="glass-card p-5 space-y-4 border-l-4 border-blue-500">
            <h3 class="text-xs font-bold text-blue-400">ဘဏ်အချက်အလက်များ</h3>
            <input id="adm-bank-name" placeholder="ဘဏ်အမည်" class="input-dark">
            <input id="adm-bank-no" placeholder="အကောင့်နံပါတ်" class="input-dark">
            <input id="adm-bank-holder" placeholder="အကောင့်ပိုင်ရှင်" class="input-dark">
            <div class="grid grid-cols-2 gap-2">
                <div><label class="text-[10px]">Bank Logo</label><input type="file" id="admLogoFile" accept="image/*" class="text-[10px]"></div>
                <div><label class="text-[10px]">QR Code</label><input type="file" id="admQrFile" accept="image/*" class="text-[10px]"></div>
            </div>
            <button onclick="saveBankSettings()" class="w-full bg-blue-600 py-2 rounded-xl text-xs font-bold">သိမ်းမည်</button>
        </div>

        <div class="glass-card p-5 space-y-4 border-l-4 border-purple-500">
            <h3 class="text-xs font-bold text-purple-400">စတော့အသစ်ထည့်ရန်</h3>
            <input id="adm-sname" placeholder="ဆာဗာအမည်" class="input-dark">
            <input id="adm-sport" placeholder="Port" class="input-dark">
            <select id="adm-flag" class="input-dark">
                <option value="th">ထိုင်း</option>
                <option value="sg">စင်ကာပူ</option>
                <option value="jp">ဂျပန်</option>
                <option value="us">အမေရိကန်</option>
            </select>
            <textarea id="adm-sconf" placeholder="V2Ray Config Key" class="input-dark h-24 text-[10px] font-mono"></textarea>
            <button onclick="addStock()" class="w-full bg-purple-600 py-2 rounded-xl text-xs font-bold">စတော့ထည့်မည်</button>
        </div>
    </div>

    <!-- LOGIN PAGE -->
    <div id="login-page" class="tab-content max-w-md mx-auto px-6 pt-24">
        <div class="glass-card p-8 text-center space-y-6">
            <i class="fas fa-lock text-blue-500 text-4xl"></i>
            <h2 class="text-2xl font-black">အက်ဒမင် ဝင်ရန်</h2>
            <input id="admPass" type="password" placeholder="စကားဝှက်" class="input-dark text-center">
            <button onclick="adminLogin()" class="w-full bg-blue-600 py-3 rounded-xl font-black">ဝင်မည်</button>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="fixed bottom-5 left-1/2 -translate-x-1/2 w-[92%] max-w-md glass-card p-1.5 flex justify-around rounded-full z-50">
        <button onclick="switchPage('user')" class="flex-1 text-center py-2 text-blue-400">စျေးဝယ်ရန်</button>
        <button onclick="switchPage('login')" class="flex-1 text-center py-2 text-slate-500">အက်ဒမင်</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc, addDoc, collection, query, where, getDocs, deleteDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLvS9xY6sUTPjk8uf0xUzeD4_UqRLWveI",
            authDomain: "topup-v2ray.firebaseapp.com",
            projectId: "topup-v2ray",
            storageBucket: "topup-v2ray.firebasestorage.app",
            messagingSenderId: "212562121085",
            appId: "1:212562121085:web:88b69e4418d0890d973c14"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "topup-v2ray";

        window.currentUser = null;
        window.userBalance = 0;
        window.selectedId = null;
        window.selectedCount = 0;
        window.uploadedSlipUrl = null;

        // Cloudinary credentials (ခင်ဗျားပေးထားတဲ့အတိုင်း)
        const cloudName = "dg1omxqvq";
        const uploadPreset = "Topup-v2ray";

        // ---------- Cloudinary Widget ----------
        function initCloudinaryWidget() {
            const uploadBtn = document.getElementById("uploadSlipBtn");
            if (!uploadBtn) return;
            uploadBtn.addEventListener("click", () => {
                const widget = cloudinary.createUploadWidget(
                    {
                        cloudName: cloudName,
                        uploadPreset: uploadPreset,
                        multiple: false,
                        cropping: false,
                        folder: "v2_slips",
                        sources: ["local", "camera", "url"]
                    },
                    (error, result) => {
                        if (!error && result && result.event === "success") {
                            const secureUrl = result.info.secure_url;
                            window.uploadedSlipUrl = secureUrl;
                            document.getElementById("slipPreviewImg").src = secureUrl;
                            document.getElementById("slipPreview").classList.remove("hidden");
                            document.getElementById("slipUrlDisplay").innerText = secureUrl.slice(0, 50) + "...";
                            document.getElementById("submitDepositBtn").disabled = false;
                        } else if (error) {
                            console.error(error);
                            alert("Upload failed: " + (error.message || "unknown error"));
                        }
                    }
                );
                widget.open();
            });
        }

        // ---------- Firebase Auth ----------
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                document.querySelector("#display-uid span").innerText = user.uid.slice(0, 8);
                const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
                onSnapshot(profileRef, (d) => {
                    if (d.exists()) {
                        window.userBalance = d.data().balance || 0;
                        document.getElementById('user-balance').innerText = window.userBalance.toLocaleString() + " THB";
                    } else {
                        setDoc(profileRef, { balance: 0, uid: user.uid });
                    }
                });
            } else {
                signInAnonymously(auth);
            }
        });

        // Bank settings listener
        const bankRef = doc(db, 'artifacts', appId, 'public', 'data', 'bank_settings');
        onSnapshot(bankRef, (d) => {
            if (d.exists()) {
                const data = d.data();
                document.getElementById('u-bank-name').innerText = data.name || 'V2BANK';
                document.getElementById('u-bank-no').innerText = data.accountNo || '123-4-56789-0';
                document.getElementById('u-bank-holder').innerText = data.holder || 'V2 PREMIUM';
                if (data.logoUrl) document.getElementById('u-bank-logo').src = data.logoUrl;
                if (data.qrUrl) document.getElementById('u-bank-qr').src = data.qrUrl;
                document.getElementById('adm-bank-name').value = data.name || '';
                document.getElementById('adm-bank-no').value = data.accountNo || '';
                document.getElementById('adm-bank-holder').value = data.holder || '';
            }
        });

        // Server stock list
        const configCol = collection(db, 'artifacts', appId, 'public', 'data', 'configs');
        function renderServerList() {
            const groups = {};
            onSnapshot(configCol, (snap) => {
                groups.clear = () => {};
                snap.forEach(d => {
                    const data = d.data();
                    const key = `${data.serverName}_${data.port}`;
                    if (!groups[key]) groups[key] = { ...data, count: 0, firstId: d.id };
                    groups[key].count++;
                });
                const listDiv = document.getElementById('server-list');
                listDiv.innerHTML = "";
                let total = 0;
                Object.values(groups).forEach(s => {
                    total += s.count;
                    listDiv.innerHTML += `<div onclick="selectServer('${s.firstId}', ${s.count})" id="srv-${s.firstId}" class="server-card border border-white/10 bg-slate-900/40 p-4 rounded-2xl cursor-pointer transition hover:bg-slate-800/50">
                        <div class="flex justify-between"><span class="font-bold">${s.serverName} (${s.port})</span><span class="text-xs ${s.count>0 ? 'text-green-400' : 'text-red-400'}">${s.count} ကျန်</span></div>
                    </div>`;
                });
                document.getElementById('stock-count').innerText = total;
            });
        }
        renderServerList();

        window.selectServer = (id, count) => {
            window.selectedId = id;
            window.selectedCount = count;
            document.querySelectorAll('.server-card').forEach(el => el.classList.remove('active-server'));
            document.getElementById(`srv-${id}`)?.classList.add('active-server');
        };

        window.generateConfig = async () => {
            if (!window.currentUser) return alert("ကျေးဇူးပြု၍ ခဏစောင့်ပါ...");
            if (window.userBalance < 50) return alert("လက်ကျန်ငွေ မလုံလောက်ပါ။ ငွေအရင်ဖြည့်ပါ။");
            if (!window.selectedId || window.selectedCount <= 0) return alert("စတော့ရှိသော ဆာဗာတစ်ခုကို ရွေးပါ။");
            const btn = document.getElementById('gen-btn');
            btn.disabled = true;
            try {
                const q = query(configCol, where("__name__", "==", window.selectedId));
                const snap = await getDocs(q);
                if (snap.empty) throw new Error("စတော့ကုန်သွားပါပြီ။");
                const data = snap.docs[0].data();
                await updateDoc(doc(db, 'artifacts', appId, 'users', window.currentUser.uid, 'profile', 'data'), { balance: increment(-50) });
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'configs', window.selectedId));
                document.getElementById('config-output').value = data.config;
                document.getElementById('result-area').classList.remove('hidden');
                alert("✅ ကွန်ဖစ်ထုတ်ယူမှု အောင်မြင်ပါသည်။");
                window.selectedId = null;
                renderServerList();
            } catch(e) { alert("❌ " + e.message); }
            finally { btn.disabled = false; }
        };

        // Submit deposit with Cloudinary URL
        window.submitDeposit = async () => {
            if (!window.currentUser) return alert("အသုံးပြုသူအချက်အလက် မရှိသေးပါ။");
            if (!window.uploadedSlipUrl) return alert("ပြေစာပုံကို Cloudinary မှာ အရင်တင်ပါ။");
            const amount = parseInt(document.getElementById('dep-amt').value);
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'topup_requests'), {
                    uid: window.currentUser.uid,
                    amount: amount,
                    slipUrl: window.uploadedSlipUrl,
                    status: "pending",
                    createdAt: serverTimestamp()
                });
                alert("✅ ငွေဖြည့်တောင်းဆိုမှု အောင်မြင်ပါသည်။ အက်ဒမင် အတည်ပြုရန် စောင့်ပါ။");
                window.uploadedSlipUrl = null;
                document.getElementById('slipPreview').classList.add('hidden');
                document.getElementById('submitDepositBtn').disabled = true;
            } catch(e) { alert("Error: " + e.message); }
        };

        // Admin approve
        window.approveDeposit = async (reqId, uid, amt) => {
            if (!confirm("အတည်ပြုပြီး ငွေထည့်ပေးမလား?")) return;
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'users', uid, 'profile', 'data'), { balance: increment(amt) });
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'topup_requests', reqId));
                alert("အတည်ပြုပြီးပါပြီ။ ငွေအပ်နှံပြီးပါပြီ။");
            } catch(e) { alert(e.message); }
        };

        // Pending requests listener
        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'topup_requests'), (snap) => {
            const container = document.getElementById('adm-req-list');
            if (!container) return;
            container.innerHTML = "";
            snap.forEach(d => {
                const r = d.data();
                if (r.status === "pending") {
                    container.innerHTML += `
                        <div class="bg-slate-900 p-3 rounded-xl space-y-2 border border-white/10">
                            <div class="flex justify-between text-xs"><span>UID: ${r.uid.slice(0,8)}</span><span class="text-green-400 font-bold">${r.amount} ฿</span></div>
                            <img src="${r.slipUrl}" class="w-24 h-24 object-cover rounded cursor-pointer" onclick="window.open(this.src)">
                            <button onclick="approveDeposit('${d.id}', '${r.uid}', ${r.amount})" class="bg-blue-600 w-full py-1 rounded text-xs font-bold">အတည်ပြုမည်</button>
                        </div>
                    `;
                }
            });
            if (container.innerHTML === "") container.innerHTML = `<div class="text-center text-slate-500 text-xs py-4">ဆိုင်းငံ့စာရင်း မရှိပါ။</div>`;
        });

        // Save bank settings (logo/qr as base64 for simplicity)
        window.saveBankSettings = async () => {
            const logoFile = document.getElementById('admLogoFile').files[0];
            const qrFile = document.getElementById('admQrFile').files[0];
            let logoUrl = document.getElementById('u-bank-logo').src;
            let qrUrl = document.getElementById('u-bank-qr').src;
            if (logoFile) {
                const reader = new FileReader();
                logoUrl = await new Promise((res) => { reader.onload = e => res(e.target.result); reader.readAsDataURL(logoFile); });
            }
            if (qrFile) {
                const reader = new FileReader();
                qrUrl = await new Promise((res) => { reader.onload = e => res(e.target.result); reader.readAsDataURL(qrFile); });
            }
            await setDoc(bankRef, {
                name: document.getElementById('adm-bank-name').value,
                accountNo: document.getElementById('adm-bank-no').value,
                holder: document.getElementById('adm-bank-holder').value,
                logoUrl: logoUrl,
                qrUrl: qrUrl
            });
            alert("ဘဏ်အချက်အလက်များ သိမ်းဆည်းပြီးပါပြီ။");
        };

        window.addStock = async () => {
            const name = document.getElementById('adm-sname').value.trim();
            if (!name) return alert("ဆာဗာအမည် ထည့်ပါ။");
            await addDoc(configCol, {
                flag: document.getElementById('adm-flag').value,
                serverName: name,
                port: document.getElementById('adm-sport').value,
                config: document.getElementById('adm-sconf').value,
                createdAt: serverTimestamp()
            });
            alert("စတော့ထည့်ပြီးပါပြီ။");
            document.getElementById('adm-sconf').value = "";
            document.getElementById('adm-sname').value = "";
            document.getElementById('adm-sport').value = "";
        };

        window.adminLogin = () => {
            const pass = document.getElementById('admPass').value;
            if (pass === "Thandarlin2001") {
                switchPage('admin');
                document.getElementById('admPass').value = "";
            } else {
                alert("စကားဝှက် မှားနေပါသည်။");
            }
        };

        window.switchPage = (page) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`${page}-page`).classList.add('active');
        };
        window.copyConfig = () => {
            navigator.clipboard.writeText(document.getElementById('config-output').value);
            alert("ကော်ပီကူးပြီးပါပြီ။");
        };

        initCloudinaryWidget();
        document.getElementById('submitDepositBtn').addEventListener('click', window.submitDeposit);
        // expose globals
        window.selectServer = window.selectServer;
        window.generateConfig = window.generateConfig;
        window.approveDeposit = window.approveDeposit;
        window.saveBankSettings = window.saveBankSettings;
        window.addStock = window.addStock;
        window.adminLogin = window.adminLogin;
        window.switchPage = window.switchPage;
        window.copyConfig = window.copyConfig;
    </script>
</body>
</html>
