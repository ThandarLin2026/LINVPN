<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinVPN Temp Mail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap');
        body { font-family: 'Pyidaungsu', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div class="max-w-xl mx-auto py-10 px-4">
        <!-- Header & Main Card -->
        <div class="bg-white rounded-[2.5rem] shadow-2xl p-8 mb-6 border border-slate-100 text-center">
            <div class="inline-block p-4 bg-blue-600 rounded-3xl shadow-lg shadow-blue-200 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </div>
            <h1 class="text-4xl font-black text-slate-800 tracking-tight mb-2">LinVPN <span class="text-blue-600">Mail</span></h1>
            <p class="text-slate-400 font-bold text-[10px] uppercase tracking-[0.2em] mb-8">Fast & Secure Temporary Email</p>

            <div class="space-y-4">
                <div class="relative group">
                    <input id="emailField" readonly class="w-full p-5 bg-slate-50 border-2 border-blue-50 rounded-2xl font-mono text-xl text-center text-blue-700 outline-none shadow-inner" value="Loading...">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="copyMail()" id="copyBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-xl shadow-blue-100 transition-all active:scale-95 flex items-center justify-center gap-2">
                        ကူးယူမည်
                    </button>
                    <button onclick="newMail()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-2">
                        အသစ်လဲမည်
                    </button>
                </div>
            </div>
        </div>

        <!-- Inbox Section -->
        <div class="bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden">
            <div class="bg-slate-50/80 px-8 py-5 border-b border-slate-100 flex justify-between items-center">
                <div class="flex items-center gap-3 font-bold text-slate-700 text-xs uppercase tracking-widest">
                    <span class="relative flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                    </span>
                    စာဝင်ပုံး (Inbox)
                </div>
                <button onclick="checkMail()" class="text-blue-600 text-sm font-bold hover:underline">Refresh</button>
            </div>
            
            <div id="inboxList" class="divide-y divide-slate-50 min-h-[400px]">
                <div class="flex flex-col items-center justify-center py-32 text-slate-300">
                    <p class="font-medium italic">အီးမေးလ် စောင့်နေပါသည်...</p>
                </div>
            </div>
        </div>

        <footer class="mt-8 text-center text-slate-400 text-[10px] font-bold uppercase tracking-widest">
            LinVPN.site © 2026 - No Registration Required
        </footer>
    </div>

    <script>
        const WORKER_URL = 'https://linvpn-tempmail.linvpn2026.workers.dev';
        const DOMAIN = 'linvpn.site';

        let currentEmail = localStorage.getItem('linvpn_mail') || generateRandomEmail();
        document.getElementById('emailField').value = currentEmail;

        function generateRandomEmail() {
            const rand = Math.random().toString(36).substring(2, 10);
            const mail = `${rand}@${DOMAIN}`;
            localStorage.setItem('linvpn_mail', mail);
            return mail;
        }

        function newMail() {
            if(confirm('အီးမေးလ်အသစ် လဲမလား?')) {
                currentEmail = generateRandomEmail();
                document.getElementById('emailField').value = currentEmail;
                checkMail();
            }
        }

        function copyMail() {
            const input = document.getElementById('emailField');
            input.select();
            document.execCommand('copy');
            const btn = document.getElementById('copyBtn');
            btn.innerText = 'Copied!';
            setTimeout(() => btn.innerText = 'ကူးယူမည်', 2000);
        }

        async function checkMail() {
            const inbox = document.getElementById('inboxList');
            try {
                const res = await fetch(`${WORKER_URL}/api/messages?email=${currentEmail}`);
                const data = await res.json();
                
                if (data.length === 0) {
                    inbox.innerHTML = `<div class="p-20 text-center text-slate-300 font-medium italic">စာမရှိသေးပါ။</div>`;
                } else {
                    inbox.innerHTML = data.reverse().map(m => `
                        <div class="p-8 hover:bg-slate-50 transition-colors cursor-pointer group">
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-[10px] font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-md uppercase tracking-wider">From: ${m.from}</span>
                                <span class="text-[10px] text-slate-400 font-bold">${new Date(m.time).toLocaleTimeString()}</span>
                            </div>
                            <h3 class="font-bold text-slate-800 text-lg mb-2 group-hover:text-blue-600 transition-colors">${m.subject}</h3>
                            <div class="text-sm text-slate-500 font-mono bg-white p-5 rounded-2xl border border-slate-100 shadow-sm whitespace-pre-wrap leading-relaxed">${m.body}</div>
                        </div>
                    `).join('');
                }
            } catch (e) {
                console.error(e);
            }
        }

        // ၅ စက္ကန့်တိုင်း အလိုအလျောက် စစ်ဆေးပေးမည်
        setInterval(checkMail, 5000);
        checkMail();
    </script>
</body>
</html>
