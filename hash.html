<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JK Free Hash Tool</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<style>
body {
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#020617,#0f172a);
    color:white;
}
.container {
    max-width:750px;
    margin:40px auto;
    padding:20px;
}
.card {
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);
    padding:20px;
    border-radius:20px;
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
}
h1 {text-align:center;}

textarea,input {
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.08);
    color:white;
}

.tabs {
    display:flex;
    gap:10px;
    margin-top:15px;
}
.tab {
    flex:1;
    text-align:center;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
    background:rgba(255,255,255,0.1);
}
.tab.active {
    background:#22c55e;
    color:black;
    font-weight:bold;
}

.result {margin-top:15px;}

.box {
    background:rgba(0,0,0,0.4);
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    position:relative;
    font-size:13px;
    word-break:break-all;
}

.copy {
    position:absolute;
    right:8px;
    top:8px;
    background:white;
    color:black;
    padding:3px 6px;
    border-radius:6px;
    cursor:pointer;
    font-size:11px;
}

.toast {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#22c55e;
    color:black;
    padding:10px 20px;
    border-radius:10px;
    opacity:0;
    transition:0.3s;
}
.toast.show {opacity:1;}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>🔐 JK Free Hash Tool</h1>

<textarea id="input" placeholder="Enter text..."></textarea>
<input id="key" placeholder="Secret key (HMAC only)">

<div class="tabs">
    <div class="tab active" onclick="switchTab('hash',this)">SHA / Hash</div>
    <div class="tab" onclick="switchTab('base64',this)">Base64</div>
    <div class="tab" onclick="switchTab('hmac',this)">HMAC</div>
</div>

<div id="output" class="result"></div>

</div>
</div>

<div id="toast" class="toast">Copied!</div>

<script>
let mode="hash";

document.getElementById("input").addEventListener("input",generate);
document.getElementById("key").addEventListener("input",generate);

function switchTab(m,el){
    mode=m;
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    el.classList.add("active");
    generate();
}

function generate(){
    let text=document.getElementById("input").value;
    let key=document.getElementById("key").value;
    let out=document.getElementById("output");

    if(!text){out.innerHTML="";return;}

    if(mode==="hash"){
        out.innerHTML=`
        ${box("MD5",CryptoJS.MD5(text))}
        ${box("SHA1",CryptoJS.SHA1(text))}
        ${box("SHA224",CryptoJS.SHA224(text))}
        ${box("SHA256",CryptoJS.SHA256(text))}
        ${box("SHA384",CryptoJS.SHA384(text))}
        ${box("SHA512",CryptoJS.SHA512(text))}
        ${box("SHA3-224",CryptoJS.SHA3(text,{outputLength:224}))}
        ${box("SHA3-256",CryptoJS.SHA3(text,{outputLength:256}))}
        ${box("SHA3-384",CryptoJS.SHA3(text,{outputLength:384}))}
        ${box("SHA3-512",CryptoJS.SHA3(text,{outputLength:512}))}
        `;
    }

    if(mode==="base64"){
        out.innerHTML=`
        ${box("Encode",CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(text)))}
        ${box("Decode",safeDecode(text))}
        `;
    }

    if(mode==="hmac"){
        out.innerHTML= key ? `
        ${box("HMAC-SHA256",CryptoJS.HmacSHA256(text,key))}
        ${box("HMAC-SHA512",CryptoJS.HmacSHA512(text,key))}
        ` : "<p style='opacity:0.6'>Enter secret key</p>";
    }
}

function safeDecode(t){
    try{return CryptoJS.enc.Utf8.stringify(CryptoJS.enc.Base64.parse(t));}
    catch{return "Invalid Base64";}
}

function box(title,val){
    return `<div class="box">
    <div class="copy" onclick="copyText(this)">Copy</div>
    <b>${title}</b><br>${val}
    </div>`;
}

function copyText(el){
    let text=el.parentElement.innerText.replace("Copy","").trim();
    navigator.clipboard.writeText(text);
    showToast();
}

function showToast(){
    let t=document.getElementById("toast");
    t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"),1500);
}
</script>

</body>
</html>
