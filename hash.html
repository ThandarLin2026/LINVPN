<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JK Hash Generator Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #4f46e5, #9333ea);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.container {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    padding: 25px;
    border-radius: 20px;
    width: 90%;
    max-width: 500px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
h2 {
    text-align: center;
    margin-bottom: 15px;
}
textarea {
    width: 100%;
    height: 100px;
    border: none;
    border-radius: 10px;
    padding: 10px;
    outline: none;
    resize: none;
}
button {
    width: 48%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}
.generate {
    background: #22c55e;
    color: white;
}
.clear {
    background: #ef4444;
    color: white;
}
.result {
    margin-top: 15px;
}
.hash-box {
    background: rgba(0,0,0,0.3);
    padding: 10px;
    border-radius: 10px;
    margin-top: 10px;
    position: relative;
    word-break: break-all;
}
.copy {
    position: absolute;
    top: 5px;
    right: 8px;
    cursor: pointer;
    font-size: 12px;
    background: #fff;
    color: #000;
    padding: 2px 6px;
    border-radius: 5px;
}
.footer {
    text-align: center;
    margin-top: 10px;
    font-size: 12px;
    opacity: 0.7;
}
</style>
</head>

<body>

<div class="container">
    <h2>🔐 JK Hash Generator Pro</h2>

    <textarea id="input" placeholder="Enter text..."></textarea>

    <div style="display:flex; gap:4%;">
        <button class="generate" onclick="generate()">Generate</button>
        <button class="clear" onclick="clearText()">Clear</button>
    </div>

    <div class="result">
        <div class="hash-box">
            <div class="copy" onclick="copyText('md5')">Copy</div>
            <b>MD5:</b>
            <div id="md5"></div>
        </div>

        <div class="hash-box">
            <div class="copy" onclick="copyText('sha1')">Copy</div>
            <b>SHA1:</b>
            <div id="sha1"></div>
        </div>

        <div class="hash-box">
            <div class="copy" onclick="copyText('sha256')">Copy</div>
            <b>SHA256:</b>
            <div id="sha256"></div>
        </div>
    </div>

    <div class="footer">© 2026 Hash Tool by You</div>
</div>

<script>
function generate() {
    let text = document.getElementById("input").value;

    document.getElementById("md5").innerText = CryptoJS.MD5(text);
    document.getElementById("sha1").innerText = CryptoJS.SHA1(text);
    document.getElementById("sha256").innerText = CryptoJS.SHA256(text);
}

function clearText() {
    document.getElementById("input").value = "";
    document.getElementById("md5").innerText = "";
    document.getElementById("sha1").innerText = "";
    document.getElementById("sha256").innerText = "";
}

function copyText(id) {
    let text = document.getElementById(id).innerText;
    navigator.clipboard.writeText(text);
    alert("Copied!");
}
</script>

</body>
</html>
